<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards · Italiano</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="site-header"><div class="inner">
  <a class="brand" href="index.html">Italiano</a>
  <nav aria-label="Site"><a href="index.html">All sessions</a><a href="flashcards.html" aria-current="page">Flashcards</a></nav>
</div></header>
<main id="main">
  <h1>Flashcards</h1>
  <form class="controls" onsubmit="return false">
    <label for="session">Session <select id="session"></select></label>
    <fieldset>
      <legend>Show first</legend>
      <label><input type="radio" name="dir" value="it" checked> Italian</label>
      <label><input type="radio" name="dir" value="en"> English</label>
    </fieldset>
    <span class="btns">
      <button type="button" id="shuffle">Shuffle</button>
      <button type="button" id="restart">Restart</button>
    </span>
  </form>
  <p class="progress" id="progress" aria-live="polite"></p>
  <div class="card" id="card" tabindex="0" role="button" aria-live="polite">
    <div class="side" id="side"></div>
    <div class="word" id="word"></div>
    <div class="detail" id="detail" hidden></div>
  </div>
  <div class="actions">
    <button type="button" id="again">Again</button>
    <button type="button" id="flip" class="primary">Flip</button>
    <button type="button" id="gotit">Got it</button>
  </div>
  <p class="hint">Tap the card or press Space to flip. Left arrow = Again, right arrow = Got it. "Again" sends the card to the back of the deck.</p>
</main>
<script src="data/sessions.js"></script>
<script src="js/site.js"></script>
<script src="js/flashcards.js"></script>
</body>
</html>
